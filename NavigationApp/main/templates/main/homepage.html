{% load static %}
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>BUIA - Navigace k nouzovému východu</title>
    <style>
        :root{
            --bg-1: #07070a;
            --bg-2: #0f1720;
            --accent: #00f5ff;
            --accent-2: #7c4dff;
            --danger: #ff6b6b;
            --success: #51cf66;
            --muted: rgba(255,255,255,0.35);
            --glass-border: rgba(255,255,255,0.04);
            font-family: Inter, system-ui, "Segoe UI", Roboto, Arial;
        }
        * { box-sizing: border-box; }
        html,body{ height:100%; margin:0; background: linear-gradient(180deg,var(--bg-1),var(--bg-2)); color:#e6eef8; }
        .app { display:flex; flex-direction:column; height:100vh; max-width:600px; margin:0 auto; }
        
        header { padding:16px; background:rgba(255,255,255,0.02); border-bottom:1px solid var(--glass-border); }
        header h1 { margin:0; font-size:20px; color:var(--accent); }
        header p { margin:4px 0 0 0; font-size:12px; color:var(--muted); }
        
        .camera-container { flex:1; position:relative; background:#000; overflow:hidden; }
        #video-feed { width:100%; height:100%; object-fit:cover; }
        #camera-overlay { position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none; }
        
        .status-bar { padding:12px 16px; background:rgba(255,255,255,0.02); border-top:1px solid var(--glass-border); }
        .location-badge { display:inline-block; padding:6px 12px; background:rgba(0,245,255,0.1); border:1px solid var(--accent); border-radius:20px; font-size:14px; font-weight:600; margin-bottom:8px; }
        .instruction { font-size:16px; line-height:1.5; margin:8px 0; }
        .confidence { font-size:12px; color:var(--muted); }
        
        /* Large prompt box styles (match safe-mode visual style) */
        .prompt-box { display:none; padding:20px; border-radius:12px; margin:12px 0; font-weight:700; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,0.4); }
        .prompt-box h2 { margin:0 0 8px 0; font-size:22px; }
        .prompt-box p { margin:0; font-size:16px; font-weight:600; }

        /* Per-location color schemes */
        .prompt-venek { background: rgba(81,207,102,0.12); border:2px solid #51cf66; color:#51cf66; }
        .prompt-chodba { background: rgba(0,180,255,0.08); border:2px solid #00b4ff; color:#00b4ff; }
        .prompt-ucebna { background: rgba(124,77,255,0.08); border:2px solid #7c4dff; color:#7c4dff; }
        .prompt-schodiste { background: rgba(255,159,28,0.08); border:2px solid #ff9f1c; color:#ff9f1c; }
        .prompt-turnikety { background: rgba(255,107,107,0.08); border:2px solid #ff6b6b; color:#ff6b6b; }
        .prompt-skrinky { background: rgba(255,230,128,0.12); border:2px solid #ffd43b; color:#ffd43b; }
        .prompt-rai { background: rgba(255,115,230,0.10); border:2px solid #ff3ca6; color:#ff3ca6; }

        .controls { padding:16px; display:flex; gap:12px; background:rgba(255,255,255,0.02); border-top:1px solid var(--glass-border); }
        .btn { flex:1; padding:14px 20px; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.2s; }
        .btn-primary { background:var(--accent); color:#000; }
        .btn-primary:hover { background:#00d4e0; }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
        
        .loading { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); padding:20px 30px; border-radius:12px; }
        .loading.active { display:block; }
        .spinner { width:30px; height:30px; border:3px solid var(--accent); border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 10px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        
        .error { display:none; padding:12px 16px; background:rgba(255,107,107,0.1); border:1px solid var(--danger); border-radius:8px; margin:16px; font-size:14px; }
        .error.active { display:block; }
        
        .safe-mode { display:none; padding:20px; background:rgba(81,207,102,0.1); border:1px solid var(--success); border-radius:12px; margin:16px; text-align:center; }
        .safe-mode.active { display:block; }
        .safe-mode h2 { margin:0 0 8px 0; color:var(--success); font-size:24px; }
        .safe-mode p { margin:0; font-size:16px; }
    /* plan window */
    .plan-window { position:absolute; right:12px; top:12px; width:220px; height:160px; z-index:12; background:linear-gradient(180deg, rgba(0,0,0,0.65), rgba(0,0,0,0.55)); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.6); overflow:hidden; border:1px solid rgba(255,255,255,0.06); }
    .plan-header { height:28px; background:rgba(255,255,255,0.03); color:var(--muted); font-size:12px; display:flex; align-items:center; padding:0 8px; }
    .plan-window img { width:100%; height:calc(100% - 28px); object-fit:contain; display:block; background:rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>BUIA - Nouzová navigace</h1>
            <p>AI asistent pro evakuaci</p>
        </header>

        <div class="camera-container">
            <video id="video-feed" autoplay playsinline muted></video>
            <div id="camera-overlay"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
            <!-- floating plan window inside camera area -->
            <div class="plan-window" id="plan-window">
                <div class="plan-header">Plán lokality</div>
                <img id="plan-img" src="/api/plan/default.png/" alt="Plán" />
            </div>
        </div>

        <div class="status-bar">
            <div id="location-display" class="location-badge" style="display:none;">
                <span id="location-name">---</span>
            </div>
            <div id="instruction-display" class="instruction">
                Zapněte kameru pro zjištění polohy
            </div>
            <div style="margin-top:12px; display:flex; gap:12px; align-items:center;">
                <div style="font-size:12px;color:var(--muted);">Aktuální plán lokality</div>
            </div>
            <div id="prompt-box" class="prompt-box">
                <h2 id="prompt-title">---</h2>
                <p id="prompt-instruction">---</p>
                <div id="prompt-confidence" class="confidence"></div>
            </div>
            <div id="confidence-display" class="confidence"></div>
        </div>

        <div class="error" id="error-display">
            <span id="error-message"></span>
        </div>

        <div class="safe-mode" id="safe-mode">
            <h2>✓ JSTE V BEZPEČÍ</h2>
            <p>Čekejte na pokyny učitelů</p>
        </div>

        <div class="controls">
            <button id="start-camera" class="btn btn-primary">📷 Spustit kameru</button>
            <button id="analyze-btn" class="btn btn-primary" disabled>🔍 Analyzovat</button>
        </div>
    </div>

    <script src="{% static 'main/camera.js' %}"></script>
</body>
</html>
